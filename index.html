<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN for 3D visual effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js CDN for subtle harmonic audio experience -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts & Google Sans typography CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">

    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');

        @font-face {
            font-family: 'Google Sans';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('https://cdn.jsdelivr.net/fontsource/fonts/google-sans:vf@latest/latin-wght-normal.woff2') format('woff2-variations');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Google Sans', 'Plus Jakarta Sans', sans-serif;
            background-color: #030307;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Ambient light dispersion effect */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(110, 86, 248, 0.18) 0%, rgba(13, 10, 36, 0.05) 50%, transparent 75%);
            filter: blur(80px);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 1.2s ease;
        }

        /* Dynamic subtle text glow */
        .text-glow {
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4),
                         0 0 55px rgba(120, 119, 255, 0.3);
            letter-spacing: 0.35em;
        }

        /* Glassmorphism subtle pill */
        .glass-badge {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }

        /* Pulse ring animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.6; }
        }

        .pulsing-dot {
            animation: pulse-ring 2.8s infinite ease-in-out;
        }

        /* Smooth canvas positioning */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-element {
            pointer-events: auto;
        }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen bg-[#030307] overflow-hidden">

    <!-- Interactive Background Glow that follows the cursor -->
    <div id="ambient-orb" class="ambient-glow top-1/2 left-1/2"></div>

    <!-- ThreeJS WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Minimalist Content Overlay -->
    <main class="content-layer w-full h-full flex flex-col items-center justify-between p-8 sm:p-14 select-none">
        
        <!-- Top Status Indicator -->
        <header class="w-full flex justify-between items-center max-w-6xl">
            <div class="glass-badge interactive-element px-4 py-1.5 rounded-full flex items-center gap-2.5 transition-all duration-300 hover:border-white/20">
                <span id="status-bulb" class="w-2 h-2 rounded-full bg-violet-400 shadow-[0_0_10px_#a78bfa] pulsing-dot"></span>
                <span class="text-[11px] uppercase tracking-[0.25em] text-white/70 font-light">In Progress</span>
            </div>

            <!-- Subtle Audio Experience Toggle -->
            <button id="sound-btn" class="interactive-element glass-badge w-10 h-10 rounded-full flex items-center justify-center text-white/60 hover:text-white hover:border-white/30 transition-all duration-300 active:scale-95" title="Toggle Ambient Audio">
                <svg id="sound-icon-off" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>
                <svg id="sound-icon-on" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
        </header>

        <!-- Center Coming Soon Minimalist Title -->
        <div class="flex flex-col items-center justify-center text-center my-auto">
            <h1 class="text-4xl sm:text-6xl md:text-8xl font-black tracking-[0.28em] uppercase text-white/95 text-glow transition-all duration-700 hover:tracking-[0.32em] cursor-default font-['Google_Sans',sans-serif]">
                COMING SOON
            </h1>
        </div>

        <!-- Footer Palette Switcher to customize ambient mood -->
        <footer class="w-full flex justify-center items-center">
            <div class="glass-badge interactive-element px-3 py-2 rounded-full flex items-center gap-3">
                <button data-theme="violet" class="theme-btn w-3.5 h-3.5 rounded-full bg-indigo-500 ring-2 ring-white/50 transition-all hover:scale-125" title="Cosmic Nebula"></button>
                <button data-theme="cyan" class="theme-btn w-3.5 h-3.5 rounded-full bg-cyan-400 opacity-60 transition-all hover:scale-125" title="Cyber Cyan"></button>
                <button data-theme="gold" class="theme-btn w-3.5 h-3.5 rounded-full bg-amber-400 opacity-60 transition-all hover:scale-125" title="Solar Gold"></button>
                <button data-theme="emerald" class="theme-btn w-3.5 h-3.5 rounded-full bg-emerald-400 opacity-60 transition-all hover:scale-125" title="Ethereal Green"></button>
            </div>
        </footer>
    </main>

    <script>
        // Setup Three.js 3D Scene
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();

        // Camera Setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 32;

        // Renderer
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Color Palettes
        const themes = {
            violet: {
                primary: 0x818cf8,
                secondary: 0xc084fc,
                glow: 'rgba(129, 140, 248, 0.22)',
                bulbClass: 'bg-violet-400 shadow-[0_0_10px_#a78bfa]'
            },
            cyan: {
                primary: 0x22d3ee,
                secondary: 0x38bdf8,
                glow: 'rgba(34, 211, 238, 0.22)',
                bulbClass: 'bg-cyan-400 shadow-[0_0_10px_#22d3ee]'
            },
            gold: {
                primary: 0xfbbf24,
                secondary: 0xf59e0b,
                glow: 'rgba(251, 191, 36, 0.22)',
                bulbClass: 'bg-amber-400 shadow-[0_0_10px_#fbbf24]'
            },
            emerald: {
                primary: 0x34d399,
                secondary: 0x10b981,
                glow: 'rgba(52, 211, 153, 0.22)',
                bulbClass: 'bg-emerald-400 shadow-[0_0_10px_#34d399]'
            }
        };

        let currentThemeKey = 'violet';

        // Particle Cosmos Setup
        const particleCount = 2800;
        const positions = new Float32Array(particleCount * 3);
        const originalPositions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const scales = new Float32Array(particleCount);
        const velocities = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(themes[currentThemeKey].primary);
        const color2 = new THREE.Color(themes[currentThemeKey].secondary);

        // Generate sacred geometry / cosmic torus vortex
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            // Torus / Vortex parametric formulas
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI * 2;
            const radius = 13 + (Math.random() - 0.5) * 5;
            const tube = 4.2 + (Math.random() - 0.5) * 3;

            const x = (radius + tube * Math.cos(v)) * Math.cos(u);
            const y = (radius + tube * Math.cos(v)) * Math.sin(u);
            const z = tube * Math.sin(v) + (Math.random() - 0.5) * 2.5;

            positions[i3] = x;
            positions[i3 + 1] = y;
            positions[i3 + 2] = z;

            originalPositions[i3] = x;
            originalPositions[i3 + 1] = y;
            originalPositions[i3 + 2] = z;

            velocities[i3] = (Math.random() - 0.5) * 0.02;
            velocities[i3 + 1] = (Math.random() - 0.5) * 0.02;
            velocities[i3 + 2] = (Math.random() - 0.5) * 0.02;

            // Gradient particle coloring
            const mixedColor = color1.clone().lerp(color2, Math.random());
            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;

            scales[i] = Math.random() * 1.5 + 0.5;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

        // Custom circular soft glow texture generated programmatically
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.6, 'rgba(255,255,255,0.15)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.65,
            map: createParticleTexture(),
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.85
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // Ethereal subtle floating orbital rings
        const ringGeo = new THREE.TorusGeometry(14, 0.035, 16, 120);
        const ringMat = new THREE.MeshBasicMaterial({
            color: themes.violet.primary,
            transparent: true,
            opacity: 0.18,
            wireframe: true
        });
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI * 0.35;
        scene.add(ring1);

        const ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(17, 0.02, 16, 120),
            ringMat.clone()
        );
        ring2.rotation.y = Math.PI * 0.45;
        ring2.material.opacity = 0.1;
        scene.add(ring2);

        // Mouse and interactive parallax coordinates
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0, isInteracting: false };
        const raycaster = new THREE.Raycaster();
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const planeIntersect = new THREE.Vector3();

        const ambientOrb = document.getElementById('ambient-orb');

        // Audio System via Tone.js
        let audioInitialized = false;
        let isAudioPlaying = false;
        let ambientSynth, filter, lfo;

        function initAudio() {
            if (audioInitialized) return;
            try {
                // Harmonic ambient pad synth
                filter = new Tone.Filter({
                    frequency: 600,
                    type: "lowpass",
                    rolloff: -24
                }).toDestination();

                ambientSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: {
                        attack: 2.5,
                        decay: 3.0,
                        sustain: 0.7,
                        release: 4.0
                    },
                    volume: -20
                }).connect(filter);

                // Subtle LFO sweep
                lfo = new Tone.LFO(0.08, 300, 1200).connect(filter.frequency);
                lfo.start();

                audioInitialized = true;
            } catch (e) {
                console.warn('Audio initialization deferred:', e);
            }
        }

        // Toggle Audio Button
        const soundBtn = document.getElementById('sound-btn');
        const soundIconOff = document.getElementById('sound-icon-off');
        const soundIconOn = document.getElementById('sound-icon-on');

        soundBtn.addEventListener('click', async () => {
            if (!audioInitialized) {
                await Tone.start();
                initAudio();
            }

            if (!isAudioPlaying) {
                // Play gentle ambient chord: D minor 9th (peaceful, ethereal)
                ambientSynth.triggerAttack(['D3', 'A3', 'C4', 'E4', 'F4']);
                soundIconOff.classList.add('hidden');
                soundIconOn.classList.remove('hidden');
                soundBtn.classList.add('border-white/40', 'bg-white/10');
                isAudioPlaying = true;
            } else {
                ambientSynth.releaseAll();
                soundIconOff.classList.remove('hidden');
                soundIconOn.classList.add('hidden');
                soundBtn.classList.remove('border-white/40', 'bg-white/10');
                isAudioPlaying = false;
            }
        });

        // Interaction listeners
        function updatePointer(clientX, clientY) {
            mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;

            // Ambient background glow tracking
            ambientOrb.style.left = `${clientX}px`;
            ambientOrb.style.top = `${clientY}px`;
        }

        window.addEventListener('mousemove', (e) => {
            updatePointer(e.clientX, e.clientY);
        });

        // Touch support for mobile devices
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePointer(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // Responsive Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // Theme button click listeners
        const themeBtns = document.querySelectorAll('.theme-btn');
        const statusBulb = document.getElementById('status-bulb');

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const themeKey = btn.dataset.theme;
                if (!themes[themeKey]) return;

                currentThemeKey = themeKey;

                // Update active state
                themeBtns.forEach(b => {
                    b.classList.remove('ring-2', 'ring-white/50');
                    b.classList.add('opacity-60');
                });
                btn.classList.remove('opacity-60');
                btn.classList.add('ring-2', 'ring-white/50');

                // Update bulb & ambient orb
                statusBulb.className = `w-2 h-2 rounded-full pulsing-dot ${themes[themeKey].bulbClass}`;
                ambientOrb.style.background = `radial-gradient(circle, ${themes[themeKey].glow} 0%, rgba(13, 10, 36, 0.05) 50%, transparent 75%)`;

                // Update ring & particle colors smoothly
                const newC1 = new THREE.Color(themes[themeKey].primary);
                const newC2 = new THREE.Color(themes[themeKey].secondary);
                ring1.material.color.set(newC1);
                ring2.material.color.set(newC2);

                const colorAttr = particleGeometry.attributes.color;
                for (let i = 0; i < particleCount; i++) {
                    const i3 = i * 3;
                    const mixed = newC1.clone().lerp(newC2, Math.random());
                    colorAttr.array[i3] = mixed.r;
                    colorAttr.array[i3 + 1] = mixed.g;
                    colorAttr.array[i3 + 2] = mixed.b;
                }
                colorAttr.needsUpdate = true;
            });
        });

        // Main Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Smooth mouse interpolation
            mouse.x += (mouse.targetX - mouse.x) * 0.045;
            mouse.y += (mouse.targetY - mouse.y) * 0.045;

            // Rotate particle system slowly
            particleSystem.rotation.y = elapsedTime * 0.08 + mouse.x * 0.45;
            particleSystem.rotation.x = Math.sin(elapsedTime * 0.05) * 0.2 + mouse.y * 0.35;

            // Rotate orbital rings in complementary directions
            ring1.rotation.z = elapsedTime * 0.05;
            ring1.rotation.y = elapsedTime * 0.03 + mouse.x * 0.2;
            ring2.rotation.z = -elapsedTime * 0.04;
            ring2.rotation.x = Math.PI * 0.45 + mouse.y * 0.2;

            // Camera subtle floating parallax
            camera.position.x = mouse.x * 2.5;
            camera.position.y = mouse.y * 2.5;
            camera.lookAt(0, 0, 0);

            // Subtle particle breathing wave effect
            const pos = particleGeometry.attributes.position.array;
            for (let i = 0; i < particleCount; i += 4) {
                const i3 = i * 3;
                const wave = Math.sin(elapsedTime * 1.5 + originalPositions[i3] * 0.2) * 0.4;
                pos[i3 + 2] = originalPositions[i3 + 2] + wave;
            }
            particleGeometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // Start animation once DOM is ready
        window.addEventListener('load', () => {
            animate();
        });
    </script>
</body>
</html>
