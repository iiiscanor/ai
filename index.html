<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN for 3D visual effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts & Google Sans typography CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">

    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');

        @font-face {
            font-family: 'Google Sans';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('https://cdn.jsdelivr.net/fontsource/fonts/google-sans:vf@latest/latin-wght-normal.woff2') format('woff2-variations');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Google Sans', 'Plus Jakarta Sans', sans-serif;
            background-color: #030307;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Ambient light dispersion effect */
        .ambient-glow {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(110, 86, 248, 0.12) 0%, rgba(13, 10, 36, 0.03) 50%, transparent 75%);
            filter: blur(80px);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 1.2s ease;
        }

        /* Dynamic subtle text glow */
        .text-glow {
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.35),
                         0 0 45px rgba(120, 119, 255, 0.22);
            letter-spacing: 0.35em;
        }

        /* Glassmorphism subtle pill */
        .glass-badge {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }

        /* Pulse ring animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.6; }
        }

        .pulsing-dot {
            animation: pulse-ring 2.8s infinite ease-in-out;
        }

        /* Smooth canvas positioning */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-element {
            pointer-events: auto;
        }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen bg-[#030307] overflow-hidden">

    <!-- Interactive Background Glow that follows the cursor -->
    <div id="ambient-orb" class="ambient-glow top-1/2 left-1/2"></div>

    <!-- ThreeJS WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Minimalist Content Overlay -->
    <main class="content-layer w-full h-full flex flex-col items-center justify-between p-8 sm:p-14 select-none">
        
        <!-- Top Status Indicator -->
        <header class="w-full flex justify-center items-center max-w-6xl">
            <div class="glass-badge interactive-element px-4 py-1.5 rounded-full flex items-center gap-2.5 transition-all duration-300 hover:border-white/20">
                <span id="status-bulb" class="w-2 h-2 rounded-full bg-violet-400 shadow-[0_0_10px_#a78bfa] pulsing-dot"></span>
                <span class="text-[11px] uppercase tracking-[0.25em] text-white/70 font-light">In Progress</span>
            </div>
        </header>

        <!-- Center Coming Soon Minimalist Title -->
        <div class="flex flex-col items-center justify-center text-center my-auto">
            <h1 class="text-4xl sm:text-6xl md:text-8xl font-black tracking-[0.28em] uppercase text-white/95 text-glow transition-all duration-700 hover:tracking-[0.32em] cursor-default font-['Google_Sans',sans-serif]">
                COMING SOON
            </h1>
        </div>

        <!-- Footer Palette Switcher to customize ambient mood -->
        <footer class="w-full flex justify-center items-center">
            <div class="glass-badge interactive-element px-3 py-2 rounded-full flex items-center gap-3">
                <button data-theme="violet" class="theme-btn w-3.5 h-3.5 rounded-full bg-indigo-500 ring-2 ring-white/50 transition-all hover:scale-125" title="Cosmic Nebula"></button>
                <button data-theme="cyan" class="theme-btn w-3.5 h-3.5 rounded-full bg-cyan-400 opacity-60 transition-all hover:scale-125" title="Cyber Cyan"></button>
                <button data-theme="gold" class="theme-btn w-3.5 h-3.5 rounded-full bg-amber-400 opacity-60 transition-all hover:scale-125" title="Solar Gold"></button>
                <button data-theme="emerald" class="theme-btn w-3.5 h-3.5 rounded-full bg-emerald-400 opacity-60 transition-all hover:scale-125" title="Ethereal Green"></button>
            </div>
        </footer>
    </main>

    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();

        // Camera setup calibrated for optimal galactic depth
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 22, 38);

        // High-performance WebGL renderer
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const galaxyThemes = {
            violet: {
                core: 0xfff4e6,
                inner: 0xc084fc,
                outer: 0x6366f1,
                nebula: 0x8b5cf6,
                glow: 'rgba(139, 92, 246, 0.22)',
                bulbClass: 'bg-violet-400 shadow-[0_0_10px_#a78bfa]'
            },
            cyan: {
                core: 0xe0f7fa,
                inner: 0x38bdf8,
                outer: 0x0284c7,
                nebula: 0x06b6d4,
                glow: 'rgba(6, 182, 212, 0.22)',
                bulbClass: 'bg-cyan-400 shadow-[0_0_10px_#22d3ee]'
            },
            gold: {
                core: 0xfffae6,
                inner: 0xfbbf24,
                outer: 0xd97706,
                nebula: 0xf59e0b,
                glow: 'rgba(245, 158, 11, 0.22)',
                bulbClass: 'bg-amber-400 shadow-[0_0_10px_#fbbf24]'
            },
            emerald: {
                core: 0xecfdf5,
                inner: 0x34d399,
                outer: 0x059669,
                nebula: 0x10b981,
                glow: 'rgba(16, 185, 129, 0.22)',
                bulbClass: 'bg-emerald-400 shadow-[0_0_10px_#34d399]'
            }
        };

        let currentThemeKey = 'violet';

        // Master container for the rotating galaxy
        const galaxyGroup = new THREE.Group();
        // Inclined perspective to appreciate the spiral disk and bulge
        galaxyGroup.rotation.x = Math.PI * 0.28;
        scene.add(galaxyGroup);

        function createStarTexture() {
            const texCanvas = document.createElement('canvas');
            texCanvas.width = 64;
            texCanvas.height = 64;
            const ctx = texCanvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.85)');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.25)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            const texture = new THREE.Texture(texCanvas);
            texture.needsUpdate = true;
            return texture;
        }

        function createNebulaTexture() {
            const texCanvas = document.createElement('canvas');
            texCanvas.width = 128;
            texCanvas.height = 128;
            const ctx = texCanvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
            grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.12)');
            grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.03)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            const texture = new THREE.Texture(texCanvas);
            texture.needsUpdate = true;
            return texture;
        }

        const starTexture = createStarTexture();
        const nebulaTexture = createNebulaTexture();

        const galaxyParams = {
            starCount: 11000,     // Reduced star density to prevent overcrowding
            branches: 4,          // 4-armed grand spiral galaxy
            radius: 26,           // Expansive galactic diameter
            spin: 1.12,           // Logarithmic spiral twist
            randomness: 0.26,     // Refined arm dispersion for clean spiral lines
            power: 1.35,          // Drastically reduced power to eliminate heavy center crowding
            nebulaCount: 450      // Airy interstellar gas clouds
        };

        const starPositions = new Float32Array(galaxyParams.starCount * 3);
        const starColors = new Float32Array(galaxyParams.starCount * 3);
        const starScales = new Float32Array(galaxyParams.starCount);
        const starSpeeds = new Float32Array(galaxyParams.starCount);

        const coreColor = new THREE.Color(galaxyThemes[currentThemeKey].core);
        const innerColor = new THREE.Color(galaxyThemes[currentThemeKey].inner);
        const outerColor = new THREE.Color(galaxyThemes[currentThemeKey].outer);

        for (let i = 0; i < galaxyParams.starCount; i++) {
            const i3 = i * 3;

            // Gentle radial dispersion with very low center accumulation
            const r = Math.pow(Math.random(), galaxyParams.power) * galaxyParams.radius;
            const isCoreBulge = r < galaxyParams.radius * 0.10 && Math.random() < 0.20; // Minimal central clumping

            if (isCoreBulge) {
                // Subtle, dispersed galactic bulge
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const bulgeR = Math.pow(Math.random(), 1.2) * (galaxyParams.radius * 0.12);

                starPositions[i3] = bulgeR * Math.sin(phi) * Math.cos(theta);
                starPositions[i3 + 1] = bulgeR * Math.sin(phi) * Math.sin(theta) * 0.55;
                starPositions[i3 + 2] = bulgeR * Math.cos(phi);

                // Gentle core star coloring
                const mixedCore = coreColor.clone().lerp(innerColor, Math.random() * 0.35);
                starColors[i3] = mixedCore.r;
                starColors[i3 + 1] = mixedCore.g;
                starColors[i3 + 2] = mixedCore.b;

                starScales[i] = Math.random() * 1.1 + 0.5;
                starSpeeds[i] = 0.0015;
            } else {
                // Logarithmic spiral arms with airy distribution
                const branchAngle = ((i % galaxyParams.branches) * 2 * Math.PI) / galaxyParams.branches;
                const spinAngle = r * galaxyParams.spin;

                const spreadPow = 2.2;
                const spreadX = Math.pow(Math.random(), spreadPow) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * (r + 1.0);
                const spreadY = Math.pow(Math.random(), spreadPow) * (Math.random() < 0.5 ? 1 : -1) * 0.09 * (r + 0.8);
                const spreadZ = Math.pow(Math.random(), spreadPow) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * (r + 1.0);

                const currentAngle = branchAngle + spinAngle;
                starPositions[i3] = Math.cos(currentAngle) * r + spreadX;
                starPositions[i3 + 1] = spreadY;
                starPositions[i3 + 2] = Math.sin(currentAngle) * r + spreadZ;

                const mixRatio = Math.min(Math.max((r - 1.5) / (galaxyParams.radius - 1.5), 0), 1);
                const mixedArm = innerColor.clone().lerp(outerColor, mixRatio);

                if (Math.random() > 0.88) {
                    mixedArm.lerp(new THREE.Color(0xa5f3fc), 0.45);
                } else if (Math.random() < 0.08) {
                    mixedArm.lerp(new THREE.Color(0xfde68a), 0.4);
                }

                starColors[i3] = mixedArm.r;
                starColors[i3 + 1] = mixedArm.g;
                starColors[i3 + 2] = mixedArm.b;

                starScales[i] = Math.random() * 1.0 + 0.3;
                starSpeeds[i] = 0.0008;
            }
        }

        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starGeometry.setAttribute('scale', new THREE.BufferAttribute(starScales, 1));

        const starMaterial = new THREE.PointsMaterial({
            size: 0.38,
            map: starTexture,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.85
        });

        const galaxyStars = new THREE.Points(starGeometry, starMaterial);
        galaxyGroup.add(galaxyStars);

        // Volumetric Interstellar Nebula Clouds
        const nebulaPositions = new Float32Array(galaxyParams.nebulaCount * 3);
        const nebulaColors = new Float32Array(galaxyParams.nebulaCount * 3);
        const nebulaThemeColor = new THREE.Color(galaxyThemes[currentThemeKey].nebula);

        for (let j = 0; j < galaxyParams.nebulaCount; j++) {
            const j3 = j * 3;
            const r = Math.pow(Math.random(), 1.6) * (galaxyParams.radius * 0.92);
            const branchAngle = ((j % galaxyParams.branches) * 2 * Math.PI) / galaxyParams.branches;
            const spinAngle = r * galaxyParams.spin;
            const spread = (Math.random() - 0.5) * 2.2;

            const angle = branchAngle + spinAngle;
            nebulaPositions[j3] = Math.cos(angle) * r + spread;
            nebulaPositions[j3 + 1] = (Math.random() - 0.5) * 0.9;
            nebulaPositions[j3 + 2] = Math.sin(angle) * r + spread;

            const nebCol = nebulaThemeColor.clone().lerp(outerColor, Math.random() * 0.5);
            nebulaColors[j3] = nebCol.r;
            nebulaColors[j3 + 1] = nebCol.g;
            nebulaColors[j3 + 2] = nebCol.b;
        }

        const nebulaGeometry = new THREE.BufferGeometry();
        nebulaGeometry.setAttribute('position', new THREE.BufferAttribute(nebulaPositions, 3));
        nebulaGeometry.setAttribute('color', new THREE.BufferAttribute(nebulaColors, 3));

        const nebulaMaterial = new THREE.PointsMaterial({
            size: 4.2,
            map: nebulaTexture,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.16
        });

        const galaxyNebulas = new THREE.Points(nebulaGeometry, nebulaMaterial);
        galaxyGroup.add(galaxyNebulas);

        const backgroundCount = 1200;
        const bgPositions = new Float32Array(backgroundCount * 3);
        for (let k = 0; k < backgroundCount * 3; k += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 120 + Math.random() * 60;

            bgPositions[k] = r * Math.sin(phi) * Math.cos(theta);
            bgPositions[k + 1] = r * Math.sin(phi) * Math.sin(theta);
            bgPositions[k + 2] = r * Math.cos(phi);
        }

        const bgGeometry = new THREE.BufferGeometry();
        bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        const bgMaterial = new THREE.PointsMaterial({
            size: 0.35,
            color: 0x8892b0,
            transparent: true,
            opacity: 0.5,
            map: starTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const starfield = new THREE.Points(bgGeometry, bgMaterial);
        scene.add(starfield);

        // Core Accretion Halo Ring
        const coreHaloGeo = new THREE.RingGeometry(0.8, 4.2, 64);
        const coreHaloMat = new THREE.MeshBasicMaterial({
            color: galaxyThemes.violet.inner,
            transparent: true,
            opacity: 0.12,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const coreHalo = new THREE.Mesh(coreHaloGeo, coreHaloMat);
        coreHalo.rotation.x = Math.PI / 2;
        galaxyGroup.add(coreHalo);

        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        const ambientOrb = document.getElementById('ambient-orb');

        function updatePointer(clientX, clientY) {
            mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;
            ambientOrb.style.left = `${clientX}px`;
            ambientOrb.style.top = `${clientY}px`;
        }

        window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        const themeBtns = document.querySelectorAll('.theme-btn');
        const statusBulb = document.getElementById('status-bulb');

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const themeKey = btn.dataset.theme;
                if (!galaxyThemes[themeKey]) return;
                currentThemeKey = themeKey;

                themeBtns.forEach(b => {
                    b.classList.remove('ring-2', 'ring-white/50');
                    b.classList.add('opacity-60');
                });
                btn.classList.remove('opacity-60');
                btn.classList.add('ring-2', 'ring-white/50');

                statusBulb.className = `w-2 h-2 rounded-full pulsing-dot ${galaxyThemes[themeKey].bulbClass}`;
                ambientOrb.style.background = `radial-gradient(circle, ${galaxyThemes[themeKey].glow} 0%, rgba(13, 10, 36, 0.05) 50%, transparent 75%)`;

                const newCore = new THREE.Color(galaxyThemes[themeKey].core);
                const newInner = new THREE.Color(galaxyThemes[themeKey].inner);
                const newOuter = new THREE.Color(galaxyThemes[themeKey].outer);
                const newNebula = new THREE.Color(galaxyThemes[themeKey].nebula);

                coreHaloMat.color.set(newInner);

                // Update galaxy star colors smoothly
                const colorAttr = starGeometry.attributes.color;
                for (let i = 0; i < galaxyParams.starCount; i++) {
                    const i3 = i * 3;
                    const r = Math.sqrt(starPositions[i3] ** 2 + starPositions[i3 + 2] ** 2);
                    const mixRatio = Math.min(Math.max((r - 1.5) / (galaxyParams.radius - 1.5), 0), 1);
                    const mixed = r < 3.2 ? newCore.clone().lerp(newInner, r / 3.2) : newInner.clone().lerp(newOuter, mixRatio);
                    colorAttr.array[i3] = mixed.r;
                    colorAttr.array[i3 + 1] = mixed.g;
                    colorAttr.array[i3 + 2] = mixed.b;
                }
                colorAttr.needsUpdate = true;

                // Update nebula gas clouds
                const nebColorAttr = nebulaGeometry.attributes.color;
                for (let j = 0; j < galaxyParams.nebulaCount; j++) {
                    const j3 = j * 3;
                    const mixedNeb = newNebula.clone().lerp(newOuter, Math.random() * 0.5);
                    nebColorAttr.array[j3] = mixedNeb.r;
                    nebColorAttr.array[j3 + 1] = mixedNeb.g;
                    nebColorAttr.array[j3 + 2] = mixedNeb.b;
                }
                nebColorAttr.needsUpdate = true;
            });
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Smooth mouse interpolation for 3D parallax
            mouse.x += (mouse.targetX - mouse.x) * 0.04;
            mouse.y += (mouse.targetY - mouse.y) * 0.04;

            // Grand spiral galaxy continuous rotation
            galaxyGroup.rotation.y = elapsedTime * 0.055;

            // Interactive galaxy tilt following cursor
            galaxyGroup.rotation.x = Math.PI * 0.28 + mouse.y * 0.25;
            galaxyGroup.rotation.z = mouse.x * 0.2;

            // Pulsing galactic core accretion halo
            coreHalo.scale.setScalar(1 + Math.sin(elapsedTime * 1.8) * 0.06);

            // Subtle camera drifting and tracking
            camera.position.x = mouse.x * 3.5;
            camera.position.y = 22 + mouse.y * 2.5;
            camera.lookAt(0, 0, 0);

            // Very slow drift for deep starfield
            starfield.rotation.y = -elapsedTime * 0.008;

            renderer.render(scene, camera);
        }

        window.addEventListener('load', () => {
            animate();
        });
    </script>
</body>
</html>
